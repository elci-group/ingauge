[[file]]
path = "ROADMAP.md"
required = true
forbid_regex = ["TODO", "FIXME", "PLACEHOLDER"]
require_regex = ["P0", "P1", "P2", "P3", "≥95/100"]
[[file]]
path = "docs/release-runbook.md"
required = true
forbid_regex = ["TODO", "FIXME", "PLACEHOLDER"]
require_regex = ["Qualified release", "Acceptance checks", "Rollback decision", "Evidence bundle"]
[[file]]
path = ".github/workflows/ci.yml"
required = true
[[file]]
path = "poka.toml"
required = true
[[file]]
path = "poka.lock"
required = true
[[file]]
path = "docs/system-integrations.md"
required = true
[[file]]
path = "packaging/ingauge.service"
required = true
[[command]]
name = "quality gate"
cmd = ["scripts/ci.sh"]
expect_exit = 0
timeout_secs = 600
[[command]]
name = "brand coherence gate"
cmd = ["brandi", "lint", "--path", ".", "--strict", "--fail-under", "90"]
expect_exit = 0
timeout_secs = 60
