[package]
name = "ingauge"
version = "0.2.1"
edition = "2021"
description = "Local inference-capacity observability and forecasting daemon"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/elci-group/ingauge"
readme = "README.md"
keywords = ["inference", "observability", "capacity", "forecasting"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40.1", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "core"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
