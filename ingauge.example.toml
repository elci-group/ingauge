schema_version = 1

[general]
poll_interval = "60s"
history_retention = "30d"
database = "ingauge.db"
connect_timeout = "3s"
request_timeout = "10s"
max_response_bytes = 1048576
max_records = 10000
max_attempts = 3

[providers.harness]
enabled = true
endpoint = "http://127.0.0.1:3000"
usage_path = "/usage"

# Any provider, router, or harness can expose the same bounded canonical
# contract. The table key becomes its probe identity.
#[providers.vico]
#enabled = true
#endpoint = "http://127.0.0.1:9876"
#usage_path = "/usage"

[forecast]
minimum_samples = 5
window = "24h"
moderate_threshold = 0.7
constrained_threshold = 0.3
critical_threshold = 0.1
