schema_version = 1

[general]
poll_interval = "60s"
history_retention = "30d"
database = "ingauge.db"
connect_timeout = "3s"
request_timeout = "10s"
max_response_bytes = 1048576
max_records = 10000
max_attempts = 3

[providers.harness]
enabled = true
endpoint = "http://127.0.0.1:3000"
usage_path = "/usage"
# api_key_env = "GROQ_API_KEY"
# credential_source = "dotenv" # bashrc | dotenv | manual_key_entry
# credential_file = "/absolute/path/to/.env"

# Any provider, router, or harness can expose the same bounded canonical
# contract. The table key becomes its probe identity.
#[providers.vico]
#enabled = true
#endpoint = "http://127.0.0.1:9876"
#usage_path = "/usage"

[forecast]
minimum_samples = 5
window = "24h"
moderate_threshold = 0.7
constrained_threshold = 0.3
critical_threshold = 0.1

# Instrument calibration is independent from telemetry collection. `tpm` is
# always tokens per minute; adaptive, historical, and provider-specific modes
# give renderers permission to select a scale without changing that unit.
[instruments]
provider_cycle_seconds = 4
dashboard_sample_seconds = 15

[instruments.network]
enabled = true
sample_interval_ms = 250
bytes_per_token = 4.0

[instruments.rpm]
min = 0
max = 10000
redline = 8500
scale_mode = "fixed"

[instruments.tpm]
min = 0
max = 100000
redline = 85000
scale_mode = "adaptive"

[instruments.rpd]
daily_limit = 100000
warning = 0.75
critical = 0.90
