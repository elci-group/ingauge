[operation]
mode = "actuate"

[watch]
path = "."
recursive = true
ignore_file = ".kaptainignore"

[cluster]
window = 5

[test]
command = "scripts/ci.sh"
required = true

[staging]
mode = "cluster"

[trust]
execution = "trusted"

[capabilities]
network_push = true

[push]
enabled = true
branch = "main"

[push.safety]
allow_force = false
require_upstream_exist = true
protect_branches = []

[build]
command = "cargo build --locked --release --offline --bin ingauge"
artifact_path = "target/release/ingauge"
timeout_secs = 1200

[ship]
enabled = true
require_qualification = true
targets = ["x86_64-unknown-linux-gnu"]

[ship.sbom]
enabled = true

[ship.provenance]
enabled = true

[ship.stable]
channels = ["binaries", "github-releases"]
push_tag = true
release_notes = true
require_qualification = true
